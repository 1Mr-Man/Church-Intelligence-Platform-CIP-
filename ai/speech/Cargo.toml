[package]
name = "cip-ai-speech"
description = "SpeechEngine implementations: NullSpeechEngine (safe default), ScriptedSpeechEngine (deterministic test adapter), and WhisperSpeechEngine (real local backend, behind the `whisper` feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cip-core-ai.workspace = true
cip-core-confidence.workspace = true
uuid.workspace = true
# whisper-rs pulls in and compiles the vendored whisper.cpp (C++/cmake) on
# every build once enabled - real, offline-buildable (no network beyond
# crates.io), but a genuine ~45s+ build cost this crate doesn't pay by
# default. See docs/live-speech.md for why this is a feature, not a
# default dependency, and for the model-download blocker in this
# environment.
whisper-rs = { version = "0.14", optional = true }

[features]
whisper = ["dep:whisper-rs"]
