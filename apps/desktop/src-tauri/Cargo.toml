[package]
name = "cip-desktop"
description = "Church Intelligence Platform desktop application (Tauri shell)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cip_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
chrono.workspace = true
uuid.workspace = true
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

cip-database.workspace = true
cip-core-bible.workspace = true
cip-core-access.workspace = true
cip-integrations-access.workspace = true
cip-core-content.workspace = true
cip-integrations-content.workspace = true
cip-core-ai.workspace = true
cip-core-service.workspace = true
cip-core-confidence.workspace = true
cip-core-intelligence.workspace = true
cip-core-presentation.workspace = true
cip-core-sermon.workspace = true
cip-presentation-renderer.workspace = true
cip-integrations-bible.workspace = true
cip-integrations-audio.workspace = true
cip-core-music.workspace = true
cip-integrations-music.workspace = true
cip-integrations-music-acoustic.workspace = true
cip-integrations-obs.workspace = true
cip-integrations-vmix.workspace = true
cip-ai-speech.workspace = true
cip-ai-embeddings.workspace = true

[features]
# Semantic Bible search is part of the normal desktop build. The feature is
# safe without model files: startup falls back to NullEmbeddingEngine until
# the local model weights and tokenizer are installed. Keeping it enabled in
# the default build ensures a configured installation can actually use
# conceptual paraphrase detection instead of silently reporting that the
# backend was not compiled.
default = ["semantic-search"]

# Off by default - see ai/speech's Cargo.toml and docs/live-speech.md for
# why the real whisper.cpp backend is opt-in rather than a default build
# dependency. Enable with `cargo tauri build --features whisper` once a
# local model is actually configured.
whisper = ["cip-ai-speech/whisper"]
# The backend is compiled into the normal desktop build. Missing model files
# remain non-fatal; the runtime uses NullEmbeddingEngine until provisioning
# is complete. Use `--no-default-features` only for a deliberately minimal
# build that does not need conceptual paraphrase detection.
semantic-search = ["cip-ai-embeddings/semantic-search"]

[dev-dependencies]
tempfile = "3"
