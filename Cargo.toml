[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",

  "core/bible",
  "core/music",
  "core/sermon",
  "core/service",
  "core/presentation",
  "core/search",
  "core/ai",
  "core/confidence",

  "database",

  "integrations/bible",
  "integrations/music",
  "integrations/web",
  "integrations/obs",
  "integrations/vmix",

  "ai/speech",
  "ai/embeddings",
  "ai/classifiers",

  "presentation/renderer",

  "tests",
]

# Phase 1 keeps every workspace crate at the same version; domain crates are
# not published, they only exist to enforce architectural boundaries at
# compile time (a crate cannot depend on another domain's internals unless
# it is exposed through that domain's public trait/type contract).
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "UNLICENSED"
repository = "https://github.com/1Mr-Man/Church-Intelligence-Platform-CIP-"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
regex = "1"

cip-core-bible = { path = "core/bible" }
cip-core-music = { path = "core/music" }
cip-core-sermon = { path = "core/sermon" }
cip-core-service = { path = "core/service" }
cip-core-presentation = { path = "core/presentation" }
cip-core-search = { path = "core/search" }
cip-core-ai = { path = "core/ai" }
cip-core-confidence = { path = "core/confidence" }
cip-database = { path = "database" }
cip-integrations-bible = { path = "integrations/bible" }
cip-integrations-music = { path = "integrations/music" }
cip-integrations-web = { path = "integrations/web" }
cip-integrations-obs = { path = "integrations/obs" }
cip-integrations-vmix = { path = "integrations/vmix" }
cip-ai-speech = { path = "ai/speech" }
cip-ai-embeddings = { path = "ai/embeddings" }
cip-ai-classifiers = { path = "ai/classifiers" }
cip-presentation-renderer = { path = "presentation/renderer" }
